<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play — Game Hub</title>
  <link rel="icon" href="site/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="site/style.css" />
</head>
<body class="play">
  <header class="top">
    <a class="logo" href="./"><span class="logo-mark" aria-hidden="true"></span><span data-site="name">Game Hub</span></a>
    <nav><a href="./#games">All games</a></nav>
  </header>

  <main id="playMain">
    <div class="play-head">
      <a class="back" href="./#games">← All games</a>
      <h1 id="title"></h1>
      <p class="muted" id="short"></p>
    </div>

    <div class="stage-wrap">
      <div class="stage" id="stage">
        <iframe id="frame" title="Game" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
        <button class="start" id="start" type="button">
          <span class="start-play" aria-hidden="true"></span>
          <span class="start-text">Play</span>
          <small id="startHint">Loads the game here</small>
        </button>
      </div>
      <div class="stage-bar">
        <button class="btn" id="fs" type="button" disabled>Fullscreen</button>
        <button class="btn" id="restart" type="button" disabled>Restart</button>
        <a class="btn" id="newtab" target="_blank" rel="noopener">Open in its own tab ↗</a>
        <span class="muted small" id="focusHint">Click inside the game if the keys don't respond.</span>
      </div>
    </div>

    <div class="detail">
      <section class="about" aria-labelledby="aboutTitle">
        <h2 id="aboutTitle">About</h2>
        <div id="desc"></div>
        <div class="tags static" id="dtags"></div>
        <div class="shots" id="shots"></div>
      </section>
      <aside class="side">
        <section id="controlsBox" aria-labelledby="ctlTitle">
          <h2 id="ctlTitle">Controls</h2>
          <dl class="controls" id="controls"></dl>
        </section>
        <p class="note" id="notes" hidden></p>
      </aside>
    </div>
  </main>

  <div class="lightbox" id="lightbox" hidden><img alt="" id="lbImg" /><button class="btn" id="lbClose" type="button">Close</button></div>
  <footer class="foot"><span data-site="footer"></span></footer>

  <script src="games.js"></script>
  <script src="site/app.js"></script>
</body>
</html>
