<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>APEX DRIFT</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <!-- Apex Drift is built on Apex Garage: same cars, garage, locations, physics, sound and look -->
  <link rel="stylesheet" href="../car-customizer/css/style.css" />
  <link rel="stylesheet" href="css/drift.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "../car-customizer/vendor/three/three.module.min.js",
        "three/addons/": "../car-customizer/vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="view" tabindex="0"></canvas>

  <header class="topbar">
    <div class="brand"><span class="brand-mark"></span><div><b>APEX DRIFT</b><small>Drift Works</small></div></div>
    <div class="car-title"><small id="carBrand"></small><b id="carName"></b></div>
    <div class="top-right">
      <div class="cost"><small>Drift points</small><b id="points">0</b></div>
      <button class="btn btn-drive" id="btnGo" title="Start drifting (Enter)">Drift</button>
      <button class="btn" id="btnGarage" title="Open Apex Garage to build and save cars">Build cars</button>
    </div>
  </header>

  <nav class="cats" id="cats" aria-label="Menu"></nav>

  <aside class="panel" id="panel">
    <div class="panel-head"><small id="panelIndex"></small><h2 id="panelTitle"></h2></div>
    <div class="panel-body" id="panelBody"></div>
  </aside>

  <section class="dock">
    <div class="dock-card stats" id="stats"></div>
    <div class="dock-card console go-card">
      <button class="start on" id="btnStart" title="Start drifting (Enter)"><span class="start-ring"></span><span>START<br>DRIFT</span></button>
      <div class="go-info">
        <small>Location</small><b id="goWorld"></b>
        <small>Mode</small><b id="goMode"></b>
        <small>Your best</small><b id="goBest"></b>
      </div>
    </div>
    <div class="dock-card views">
      <div class="sec" style="margin-top:0">Driving tips</div>
      <p class="tip" id="tip"></p>
    </div>
  </section>

  <!-- ===================================================== driving HUD (Apex Garage layout) -->
  <div class="drive-hud" id="driveHud">
    <div class="hud-top">
      <div class="hud-left">
        <div class="hud-place"><small>Now drifting</small><b id="hudPlace"></b><small id="hudTrans" class="hud-trans"></small></div>
      </div>
      <div class="hud-mid">
        <div class="hud-score">
          <div><small>Score</small><b id="hudScore">0</b></div>
          <div class="hud-mult-wrap"><b id="hudMult">×1</b><span class="combo"><u id="hudComboBar"></u></span></div>
          <div><small>Best</small><b id="hudPb" class="dim">0</b></div>
        </div>
        <div class="hud-drift" id="hudDrift"></div>
        <div class="hud-angle" id="hudAngleWrap"><i id="hudAngle"></i><small id="hudAngleTxt"></small></div>
        <div class="hud-feed" id="hudFeed" aria-live="polite"></div>
      </div>
      <div class="hud-right">
        <div class="hud-btns">
          <button class="btn hud-cam" id="hudCam" title="Switch camera: Third-person → Cockpit → Hood (C). B changes the third-person distance."><small>Camera · C</small><span id="hudCamName">Third-person · Far</span></button>
          <button class="btn" id="hudReset">Reset · R</button>
          <button class="btn btn-drive" id="hudExit">Garage · Esc</button>
        </div>
        <div class="hud-laps" id="hudLaps"><div><small id="hudLapLbl">Lap</small><b id="hudLap">—</b></div><div><small id="hudLastLbl">Last</small><b id="hudLast">—</b></div><div><small id="hudBestLbl">Best lap</small><b id="hudBest">—</b></div></div>
      </div>
    </div>
    <div class="hud-count" id="hudCount"></div>
    <div class="hud-aids" id="hudAids"><i id="aidABS">ABS</i><i id="aidTCS">TCS</i><i id="aidESP">ESP</i></div>
    <div class="hud-speed"><b id="hudSpeed">0</b><small>km/h</small><i id="hudGearBox"><span id="hudGear">1</span></i></div>

    <div class="touch" id="touch" hidden>
      <div class="t-left">
        <button type="button" data-touch="left" aria-label="Steer left">◀</button>
        <button type="button" data-touch="right" aria-label="Steer right">▶</button>
      </div>
      <div class="t-right">
        <button type="button" class="t-hand" data-touch="hand">HAND<br>BRAKE</button>
        <button type="button" class="t-brake" data-touch="back">BRAKE</button>
        <button type="button" class="t-gas" data-touch="fwd">GAS</button>
      </div>
    </div>
  </div>

  <!-- ===================================================== results -->
  <div class="drive-menu" id="results" role="dialog" aria-label="Run results">
    <div class="drive-box result-box">
      <div class="panel-head"><small id="resKicker">RUN COMPLETE</small><h2 id="resTitle">Finished</h2></div>
      <div class="medal" id="resMedal"></div>
      <p class="dm-note" id="resSub"></p>
      <div class="res-stats" id="resStats"></div>
      <div class="res-btns">
        <button class="btn btn-drive" id="resAgain">Drift again</button>
        <button class="btn" id="resClose">Back to garage</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <div class="loader" id="loader"><div class="loader-box"><span class="brand-mark"></span><b>APEX DRIFT</b><small id="loaderMsg">Warming up the tyres…</small></div></div>

  <script type="module" src="js/main.js"></script>
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('loaderMsg').innerHTML =
        'This game must be served over http.<br>Run <b>node server.js</b> in the site folder and open <b>http://localhost:5173</b>.';
    }
  </script>
</body>
</html>
